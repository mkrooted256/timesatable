[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "timesatable"
version = "0.1.0"
description = "Constraint-based timetable compiler using WBO SAT solver"
requires-python = ">=3.13"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
timetable = "timetable.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["timetable*"]
